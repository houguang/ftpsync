[package]
name = "sync-core"
version = "0.1.0"
description = "FTPSync 同步内核：配置、FTP/FTPS 客户端、文件监听与同步引擎（不含界面依赖）"
edition = "2021"
rust-version = "1.88"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "8"
globset = "0.4"
suppaftp = { version = "12", features = ["native-tls"] }
